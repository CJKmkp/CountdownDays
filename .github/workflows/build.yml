name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:

jobs:
  build:
    uses: InkCanvasForClass/community/.github/workflows/plugin-build.yml@net6
    with:
      project: CountdownDays.csproj
      plugin_id: com.icc.countdown-days
      plugin_name: 桌面倒计日
      plugin_description: '桌面倒计时与纪念日小工具，支持多个目标、临近提醒、可拖动悬浮'
      auto_release: true
    secrets: inherit
